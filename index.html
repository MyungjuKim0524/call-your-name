<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네 이름을 불러줄게! - 힐링 비주얼 노벨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #1f1712;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .font-cute {
      font-family: 'Jua', sans-serif;
    }

    /* 손그림 느낌의 레트로 윈도우 & 말풍선 프레임 */
    .retro-window {
      background: #fffdf9;
      border: 3.5px solid #3e3636;
      box-shadow: 6px 6px 0px #3e3636;
    }
    .dialogue-box {
      background: rgba(255, 253, 248, 0.96);
      border: 3.5px solid #3e3636;
      box-shadow: 0 10px 25px rgba(25, 15, 8, 0.45), 4px 4px 0px #3e3636;
    }
    .choice-btn {
      background: #fffdf9;
      border: 3px solid #3e3636;
      box-shadow: 4px 4px 0px #3e3636;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .choice-btn:hover {
      background: #fef3c7;
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px #3e3636;
    }
    .choice-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #3e3636;
    }

    /* 캐릭터 숨쉬기 & 통통 튀는 애니메이션 */
    @keyframes charBob {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-4px) scaleY(1.018); }
    }
    .char-idle {
      transform-origin: bottom center;
      animation: charBob 2.6s ease-in-out infinite;
    }

    /* 3번 장면: 자기들끼리 신나게 떠드는 애니메이션 */
    @keyframes chatterBounce {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      25% { transform: translateY(-6px) rotate(2deg); }
      50% { transform: translateY(0px) rotate(-1.5deg); }
      75% { transform: translateY(-4px) rotate(2.5deg); }
    }
    .char-chatter {
      transform-origin: bottom center;
      animation: chatterBounce 1.1s ease-in-out infinite;
    }

    /* 문 열릴 때 깜짝 놀라며 쳐다보는 효과 */
    @keyframes noticePlayer {
      0% { transform: scale(1) translateY(0); }
      40% { transform: scale(1.07, 0.94) translateY(-10px); }
      75% { transform: scale(0.98, 1.03) translateY(0); }
      100% { transform: scale(1) translateY(0); }
    }
    .char-notice {
      transform-origin: bottom center;
      animation: noticePlayer 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 4번 리트리버가 2번 기니피그 옆에 찰싹 달라붙는 애니메이션 */
    @keyframes clingSide {
      0%, 100% { transform: translateX(0px) rotate(0deg); }
      50% { transform: translateX(8px) rotate(3deg); }
    }
    .char-cling {
      transform-origin: bottom center;
      animation: clingSide 2s ease-in-out infinite;
    }

    /* 오두막 모닥불 불꽃 일렁임 & 조명 호흡 */
    @keyframes fireFlicker {
      0%, 100% { transform: scale(1) skewX(0deg); opacity: 0.92; }
      33% { transform: scale(1.06, 0.96) skewX(-2deg); opacity: 1; }
      66% { transform: scale(0.96, 1.07) skewX(2deg); opacity: 0.88; }
    }
    .fire-flame {
      transform-origin: bottom center;
      animation: fireFlicker 0.85s ease-in-out infinite;
    }

    @keyframes warmRoomGlow {
      0%, 100% { opacity: 0.42; }
      50% { opacity: 0.58; }
    }
    .cabin-glow {
      animation: warmRoomGlow 2.4s ease-in-out infinite;
    }

    /* 1인칭 방문 열림 애니메이션 */
    @keyframes doorSwingLeft {
      0% { transform: perspective(900px) rotateY(0deg); }
      100% { transform: perspective(900px) rotateY(-88deg); }
    }
    @keyframes doorSwingRight {
      0% { transform: perspective(900px) rotateY(0deg); }
      100% { transform: perspective(900px) rotateY(88deg); }
    }
    .door-open-left {
      transform-origin: left center;
      animation: doorSwingLeft 1.15s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }
    .door-open-right {
      transform-origin: right center;
      animation: doorSwingRight 1.15s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    /* 화면 전환 페이드인 */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      animation: fadeSlideUp 0.4s ease-out forwards;
    }

    .svg-char {
      filter: drop-shadow(0 5px 7px rgba(45, 28, 15, 0.28));
      overflow: visible;
    }

    /* 오두막 방석 위에 자연스럽게 앉아 있는 연출 */
    .seated-cushion {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .seated-cushion::before {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      height: 16px;
      border-radius: 9999px;
      background: radial-gradient(ellipse at center, #fcd34d 0%, #d97706 72%, #78350f 100%);
      border: 2px solid #3e3636;
      box-shadow: 0 5px 10px rgba(20, 10, 4, 0.65);
      z-index: 0;
    }
    .seated-cushion > svg {
      position: relative;
      z-index: 1;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center bg-[#1c140f]">

  <!-- 공용 SVG 크레용 필터 & 볼터치 그라데이션 정의 (hidden 대신 0px 크기로 렌더링 보장) -->
  <svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
    <defs>
      <filter id="crayonBrush" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="3" seed="17" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <radialGradient id="blushPink" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff8fb3" stop-opacity="0.72"/>
        <stop offset="68%" stop-color="#ffb3ca" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#ffb3ca" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blushPeach" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9494" stop-opacity="0.58"/>
        <stop offset="70%" stop-color="#ffb3b3" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#ffb3b3" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- 메인 게임 뷰포트 컨테이너 (모바일/태블릿/데스크탑 반응형 풀스크린) -->
  <div id="gameFrame" class="relative w-full h-full max-w-2xl mx-auto overflow-hidden bg-[#fdf8ef] sm:rounded-3xl sm:h-[94vh] sm:border-4 sm:border-[#3e3636] shadow-2xl flex flex-col">

    <!-- 상단 상태바 (사운드 토글 & 처음부터 버튼) -->
    <div class="absolute top-3 left-3 right-3 z-40 flex items-center justify-between pointer-events-none">
      <div id="sceneBadge" class="px-3 py-1 rounded-full bg-white/90 border-2 border-[#3e3636] font-cute text-xs sm:text-sm text-[#3e3636] shadow-sm">
        CHAPTER 01 · 오프닝
      </div>
      <div class="flex items-center gap-2 pointer-events-auto">
        <button id="soundToggleBtn" onclick="toggleSound()" class="px-3 py-1.5 rounded-full bg-white/95 border-2 border-[#3e3636] font-cute text-xs text-[#3e3636] hover:bg-amber-100 shadow-sm cursor-pointer">
          🎵 음악 & 효과음 ON
        </button>
        <button id="restartTopBtn" onclick="resetGame()" class="hidden px-3 py-1.5 rounded-full bg-amber-100 border-2 border-[#3e3636] font-cute text-xs text-[#3e3636] hover:bg-amber-200 shadow-sm cursor-pointer">
          ↺ 처음부터
        </button>
      </div>
    </div>

    <!-- ==================== [화면 1] 오프닝 타이틀: 네 이름을 불러줄게! ==================== -->
    <div id="screen1" onclick="goToScreen2()" class="w-full h-full flex flex-col items-center justify-center p-6 cursor-pointer bg-gradient-to-b from-[#fffdf7] via-[#fdf5e6] to-[#f8ebd2] relative">
      <div class="flex gap-2 mb-5 text-2xl sm:text-3xl animate-bounce">
        <span>🦦</span><span>🐺</span><span>🐹</span><span>🐰</span><span>🐶</span><span>🐹</span>
      </div>

      <div class="retro-window rounded-3xl px-8 py-10 sm:px-14 sm:py-12 text-center max-w-md w-full bg-white relative">
        <p class="font-cute text-sm sm:text-base text-amber-700 mb-2 tracking-wider">24/7 WITH YOU</p>
        <h1 class="font-cute text-4xl sm:text-5xl text-[#3e3636] leading-snug tracking-wide">
          네 이름을<br>불러줄게!
        </h1>
        <div class="mt-6 pt-5 border-t-2 border-dashed border-amber-200">
          <span class="inline-block px-5 py-2 rounded-full bg-amber-300 border-2 border-[#3e3636] font-cute text-base sm:text-lg text-[#3e3636] animate-pulse">
            화면을 터치해서 시작하기 ▶
          </span>
        </div>
      </div>

      <p class="mt-6 text-xs sm:text-sm text-stone-500 font-medium">
        지친 하루 끝, 너만을 기다리는 작은 오두막 이야기
      </p>
    </div>

    <!-- ==================== [화면 2] 레트로 편지봉투 윈도우 이름 입력창 ==================== -->
    <div id="screen2" class="hidden w-full h-full flex-col items-center justify-center p-6 bg-gradient-to-b from-[#fdf5e6] to-[#f5e4c3] relative">
      <div class="retro-window rounded-2xl w-full max-w-md overflow-hidden fade-in-up">
        <!-- 윈도우 상단 바 -->
        <div class="bg-amber-200 border-b-[3.5px] border-[#3e3636] px-4 py-2.5 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-3.5 h-3.5 rounded-full bg-rose-400 border-2 border-[#3e3636]"></span>
            <span class="w-3.5 h-3.5 rounded-full bg-amber-400 border-2 border-[#3e3636]"></span>
            <span class="w-3.5 h-3.5 rounded-full bg-emerald-400 border-2 border-[#3e3636]"></span>
            <span class="font-cute text-base sm:text-lg text-[#3e3636] ml-1 tracking-wide">NEW!</span>
          </div>
          <!-- 분홍 하트 실링 편지 봉투 아이콘 -->
          <div class="w-9 h-7 bg-white border-2 border-[#3e3636] rounded flex items-center justify-center relative shadow-xs">
            <svg viewBox="0 0 36 26" class="w-7 h-5">
              <polyline points="2,2 18,15 34,2" fill="none" stroke="#3e3636" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M18 18 l-1.2-1.1 C13.5 14 11.5 12.2 11.5 9.8 c0-1.9 1.5-3.3 3.3-3.3 1.1 0 2.1.5 2.7 1.3 .6-.8 1.6-1.3 2.7-1.3 1.8 0 3.3 1.4 3.3 3.3 0 2.4-2 4.2-5.3 7.1 L18 18z" fill="#ff7eb3"/>
            </svg>
          </div>
        </div>

        <!-- 입력 폼 내용 -->
        <form onsubmit="submitName(event)" class="p-6 sm:p-8 text-center bg-white">
          <p class="font-cute text-xl sm:text-2xl text-[#3e3636] mb-5">
            당신의 이름을 입력해주세요
          </p>
          <input
            id="playerNameInput"
            type="text"
            maxlength="10"
            placeholder="예: 민수, 지민, 나 자신..."
            class="w-full px-4 py-3 rounded-xl border-[3px] border-[#3e3636] bg-[#fffdf7] text-center font-cute text-xl sm:text-2xl text-[#3e3636] focus:outline-none focus:ring-4 focus:ring-amber-200 mb-5"
            required
          />
          <button
            type="submit"
            class="w-full py-3.5 rounded-xl bg-amber-300 hover:bg-amber-400 border-[3px] border-[#3e3636] font-cute text-xl text-[#3e3636] shadow-[4px_4px_0px_#3e3636] active:translate-x-[2px] active:translate-y-[2px] transition cursor-pointer"
          >
            입력 완료 ✉️
          </button>
        </form>
      </div>
    </div>

    <!-- ==================== [화면 3 ~ 13] 따뜻한 모닥불 오두막 스테이지 ==================== -->
    <div id="cabinStage" class="hidden w-full h-full flex-col justify-between relative overflow-hidden bg-[#3b2314]">

      <!-- 오두막 배경 (모닥불 난로 + 노란 조명 + 나무 벽면) -->
      <div class="absolute inset-0 pointer-events-none">
        <!-- 나무 벽면 가로 판자 패턴 -->
        <div class="w-full h-full opacity-35" style="background-image: repeating-linear-gradient(to bottom, #26150b 0px, #26150b 3px, #4d2e1b 3px, #4d2e1b 46px);"></div>

        <!-- 천장 노란 전구 조명 & 원뿔형 따뜻한 빛 -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 flex flex-col items-center">
          <div class="w-1.5 h-8 bg-[#26150b]"></div>
          <div class="w-14 h-7 bg-amber-500 border-2 border-[#26150b] rounded-t-full"></div>
          <div class="w-6 h-6 rounded-full bg-amber-200 shadow-[0_0_50px_25px_rgba(253,224,71,0.75)] -mt-2"></div>
        </div>
        <div class="cabin-glow absolute inset-0" style="background: radial-gradient(circle at 50% 42%, rgba(253, 224, 71, 0.55) 0%, rgba(245, 158, 11, 0.25) 45%, rgba(28, 15, 8, 0.85) 100%);"></div>

        <!-- 중앙 모닥불 벽난로 -->
        <div class="absolute bottom-[28%] left-1/2 -translate-x-1/2 w-64 sm:w-80 h-52 sm:h-60 flex flex-col items-center justify-end">
          <!-- 벽난로 선반 & 벽돌 틀 -->
          <div class="w-full h-4 bg-[#5c3620] border-[3px] border-[#26150b] rounded-t-lg z-10"></div>
          <div class="w-[92%] h-44 bg-[#6e4228] border-x-[3px] border-[#26150b] flex items-end justify-center px-5 pt-5 relative">
            <!-- 벽난로 아치형 화덕 -->
            <div class="w-full h-full bg-[#24130a] rounded-t-full border-t-[3px] border-x-[3px] border-[#26150b] flex flex-col items-center justify-end pb-2 overflow-hidden relative">
              <!-- 모닥불 빛 번짐 -->
              <div class="absolute inset-0 bg-radial from-orange-500/40 to-transparent"></div>
              <!-- 타오르는 불꽃 -->
              <svg viewBox="0 0 120 100" class="w-28 h-24 fire-flame z-10">
                <path d="M60 12 C42 36 28 54 34 78 C38 92 82 92 86 78 C92 54 78 36 60 12 Z" fill="#f97316"/>
                <path d="M60 28 C48 46 40 60 44 78 C47 88 73 88 76 78 C80 60 72 46 60 28 Z" fill="#facc15"/>
                <path d="M60 48 C53 59 49 68 52 79 C54 85 66 85 68 79 C71 68 67 59 60 48 Z" fill="#fef9c3"/>
              </svg>
              <!-- 장작더미 -->
              <div class="flex gap-1 -mt-3 z-20">
                <div class="w-16 h-3.5 bg-[#4a2815] border-2 border-[#1f1008] rounded-full rotate-12"></div>
                <div class="w-16 h-3.5 bg-[#3b1f10] border-2 border-[#1f1008] rounded-full -rotate-12 -ml-8"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 오두막 나무 바닥 & 포근한 원형 러그 -->
        <div class="absolute bottom-0 w-full h-[30%] bg-[#472a19] border-t-[3px] border-[#26150b]">
          <div class="w-4/5 max-w-md h-20 mx-auto mt-3 rounded-[100%] bg-amber-900/50 border-2 border-amber-700/40"></div>
        </div>
      </div>

      <!-- [화면 3 전용] 1인칭 시점: 한숨을 쉬며 방문을 여는 연출 오버레이 -->
      <div id="doorIntroOverlay" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center">
        <!-- 좌우 나무 방문 짝 -->
        <div id="doorLeft" class="absolute top-0 bottom-0 left-0 w-1/2 bg-[#3d2314] border-r-2 border-[#1f1109] flex items-center justify-end pr-4 shadow-2xl">
          <div class="w-4 h-12 rounded-full bg-amber-500 border-2 border-[#1f1109]"></div>
        </div>
        <div id="doorRight" class="absolute top-0 bottom-0 right-0 w-1/2 bg-[#3d2314] border-l-2 border-[#1f1109] flex items-center justify-start pl-4 shadow-2xl">
          <div class="w-4 h-12 rounded-full bg-amber-500 border-2 border-[#1f1109]"></div>
        </div>
        <!-- 한숨 & 독백 말풍선 -->
        <div id="sighTextBox" class="relative z-40 px-6 py-4 rounded-2xl bg-black/75 border-2 border-amber-200/60 text-center text-amber-50 font-cute text-lg sm:text-xl shadow-xl">
          "후우...... 오늘도 정말 수고 많았어."
        </div>
      </div>

      <!-- 중앙 캐릭터 무대 영역 (장면별로 6마리 / 1마리 / 2마리 동적 배치) -->
      <div id="stageCharacters" class="relative z-20 flex-1 w-full flex items-end justify-center px-3 pt-14 pb-2">
        <!-- JS로 동적 렌더링 -->
      </div>

      <!-- 하단 대화창 & 선택지 영역 -->
      <div class="relative z-30 w-full px-3 pb-4 sm:px-6 sm:pb-6">
        <!-- [화면 5 전용] A, B, C 고민 선택지 카드 -->
        <div id="choiceContainer" class="hidden space-y-2.5 max-w-lg mx-auto fade-in-up">
          <button onclick="selectChoice('A')" class="choice-btn w-full text-left p-3.5 sm:p-4 rounded-2xl cursor-pointer">
            <span class="inline-block px-2 py-0.5 rounded-md bg-blue-100 border border-[#3e3636] font-cute text-xs text-blue-800 mr-1.5">A</span>
            <span class="font-cute text-sm sm:text-base text-[#3e3636] leading-snug">
              지금 하는 게 내 길이 맞는지 모르겠어, 소질 없는 거 같아... 잘할 수 있을까?
            </span>
          </button>

          <button onclick="selectChoice('B')" class="choice-btn w-full text-left p-3.5 sm:p-4 rounded-2xl cursor-pointer">
            <span class="inline-block px-2 py-0.5 rounded-md bg-rose-100 border border-[#3e3636] font-cute text-xs text-rose-800 mr-1.5">B</span>
            <span class="font-cute text-sm sm:text-base text-[#3e3636] leading-snug">
              답을 모르겠는 매일이 두려워... 자존감만 낮아져
            </span>
          </button>

          <button onclick="selectChoice('C')" class="choice-btn w-full text-left p-3.5 sm:p-4 rounded-2xl cursor-pointer">
            <span class="inline-block px-2 py-0.5 rounded-md bg-emerald-100 border border-[#3e3636] font-cute text-xs text-emerald-800 mr-1.5">C</span>
            <span class="font-cute text-sm sm:text-base text-[#3e3636] leading-snug">
              모르겠어, 요즘 그냥 눈물이 막 나...
            </span>
          </button>
        </div>

        <!-- 일반 대화창 -->
        <div id="dialogueBox" onclick="handleNextDialogue()" class="dialogue-box rounded-2xl p-4 sm:p-5 max-w-lg mx-auto cursor-pointer relative">
          <!-- 화자 이름표 배지 -->
          <div id="speakerTag" class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-amber-200 border-2 border-[#3e3636] font-cute text-sm sm:text-base text-[#3e3636] mb-2">
            <span id="speakerIcon">🐾</span>
            <span id="speakerName">오두막 친구들</span>
          </div>

          <!-- 대사 본문 -->
          <div id="dialogueText" class="font-cute text-lg sm:text-xl text-[#3e3636] leading-relaxed min-h-[3.6rem] whitespace-pre-line">
            <!-- JS 텍스트 출력 -->
          </div>

          <!-- 다음 안내 화살표 -->
          <div class="flex items-center justify-between mt-3 pt-2 border-t border-amber-200/70">
            <span id="subHintText" class="text-xs text-stone-400">대화창을 터치하면 다음으로 넘어갑니다</span>

    class ProfanityTrie {
      constructor(words = []) {
        this.root = {};
        words.forEach((word) => this.insert(word));
      }
      insert(word) {
        let node = this.root;
        for (const ch of word.toLowerCase()) {
          if (!node[ch]) node[ch] = {};
          node = node[ch];
        }
        node.isEnd = true;
      }
      containsBadWord(text) {
        const clean = text.toLowerCase().replace(/\s+/g, "");
        for (let i = 0; i < clean.length; i++) {
          let node = this.root;
          for (let j = i; j < clean.length; j++) {
            const ch = clean[j];
            if (!node[ch]) break;
            node = node[ch];
            if (node.isEnd) return true;
          }
        }
        return false;
      }
    }

    // ==================== 사운드 엔진 (Tone.js: 효과음 + 잔잔한 통기타 BGM + 모닥불 소리) ====================
    async function initAndStartAudio() {
      if (typeof Tone === "undefined") return;
      try {
        if (Tone.context.state !== "running") {
          await Tone.start();
        }
        if (!synth) {
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.02, decay: 0.25, sustain: 0.1, release: 0.8 },
            volume: -12
          }).toDestination();
        }

        if (!bgmStarted) {
          bgmStarted = true;

          const reverb = new Tone.Reverb({ decay: 2.8, wet: 0.38 }).toDestination();
          guitarSynth = new Tone.PluckSynth({
            attackNoise: 0.6,
            dampening: 3200,
            resonance: 0.94,
            release: 1.6,
            volume: -14
          }).connect(reverb);

          const notes = [
            "C3", "G3", "E4", "B3", "C4", "G3", "E4", "G3",
            "A2", "E3", "C4", "G3", "A3", "E3", "C4", "E3",
            "F2", "C3", "A3", "E3", "G3", "C3", "A3", "C3",
            "G2", "D3", "B3", "F#3", "G3", "D3", "B3", "D3"
          ];
          let stepIdx = 0;

          bgmLoop = new Tone.Loop((time) => {
            if (!soundEnabled || !guitarSynth) return;
            const note = notes[stepIdx % notes.length];
            guitarSynth.triggerAttack(note, time);
            stepIdx++;
          }, "4n");

          Tone.Transport.bpm.value = 76;
          bgmLoop.start(0);
          Tone.Transport.start();

          const fireFilter = new Tone.Filter(1400, "bandpass").toDestination();
          fireNoiseSynth = new Tone.NoiseSynth({
            noise: { type: "pink" },
            envelope: { attack: 0.005, decay: 0.045, sustain: 0, release: 0.02 },
            volume: -24
          }).connect(fireFilter);

          const scheduleCrackle = () => {
            if (soundEnabled && fireNoiseSynth && Tone.context.state === "running") {
              fireNoiseSynth.triggerAttackRelease("32n");
            }
            const nextDelay = 350 + Math.random() * 1400;
            fireCracklingTimer = setTimeout(scheduleCrackle, nextDelay);
          };
          scheduleCrackle();
        }
      } catch (e) {
        // 오디오 초기화 실패 시 조용히 무시
      }
    }

    function playChime(notes = ["C5", "E5", "G5"], duration = "8n") {
      if (!soundEnabled || typeof Tone === "undefined") return;

        const now = Tone.now();
        notes.forEach((note, idx) => {

        });
      });
    }

    // ==================== 장면 전환 로직 ====================
    function goToScreen2() {
      initAndStartAudio();
      playChime(["E5", "G5", "B5"]);
      document.getElementById("screen1").classList.add("hidden");
      const s2 = document.getElementById("screen2");
      s2.classList.remove("hidden");
      s2.classList.add("flex");

      setTimeout(() => document.getElementById("playerNameInput").focus(), 100);

    function submitName(e) {
      e.preventDefault();
      initAndStartAudio();
      const inputVal = document.getElementById("playerNameInput").value.trim();
      playerName = inputVal || "친구";
      playChime(["C5", "E5", "G5", "C6"]);

      document.getElementById("screen2").classList.add("hidden");
      document.getElementById("screen2").classList.remove("flex");

      startScene3DoorIntro();

    // [화면 3] 한숨 쉬며 방문을 여는 1인칭 시점 + 떠들다가 일제히 쳐다보는 6마리 연출
    function startScene3DoorIntro() {
      currentStep = "3";
      document.getElementById("sceneBadge").textContent = "SCENE 03 · 따뜻한 오두막";

      const stage = document.getElementById("cabinStage");
      stage.classList.remove("hidden");
      stage.classList.add("flex");

      const stageEl = document.getElementById("stageCharacters");
      stageEl.innerHTML = `
        <div id="groupCabin6" class="relative w-full max-w-lg h-72 sm:h-80 mx-auto flex flex-col justify-end pb-1">
          <!-- 상단 반응 말풍선 (처음엔 서로 떠들기 → 문 열리면 깜짝!) -->
          <div id="chatterBubble" class="mx-auto mb-2 px-4 py-1.5 rounded-full bg-white/95 border-2 border-[#3e3636] font-cute text-xs sm:text-sm text-[#3e3636] shadow-md transition-all duration-300 z-40">
            💬 와글와글~ 오늘 언제 오려나?!
          </div>

          <!-- 오두막 거실 러그 위 2열 방석 배치 (겹침 없이 각자 자리에 자연스럽게 착석) -->
          <div class="w-full flex flex-col gap-1.5">
            <!-- 뒷줄 (벽난로 앞쪽 러그): 2(기니피그), 4(리트리버), 5(족제비) -->
            <div class="grid grid-cols-3 gap-1 sm:gap-2 px-6 sm:px-10 items-end">
              <div class="seated-cushion w-20 h-20 sm:w-24 sm:h-24 mx-auto">
                ${getCharSVG(2, { extraClass: "char-chatter", flip: true })}
              </div>
              <div class="seated-cushion w-20 h-20 sm:w-24 sm:h-24 mx-auto">
                ${getCharSVG(4, { extraClass: "char-chatter" })}
              </div>
              <div class="seated-cushion w-20 h-20 sm:w-24 sm:h-24 mx-auto">
                ${getCharSVG(5, { extraClass: "char-chatter" })}
              </div>
            </div>

            <!-- 앞줄 (거실 앞쪽 러그): 6(햄스터), 3(늑대), 1(토끼) -->
            <div class="grid grid-cols-3 gap-2 sm:gap-3 px-2 sm:px-5 items-end -mt-2">
              <div class="seated-cushion w-22 h-22 sm:w-28 sm:h-28 mx-auto">
                ${getCharSVG(6, { extraClass: "char-chatter", flip: true })}
              </div>
              <div class="seated-cushion w-22 h-22 sm:w-28 sm:h-28 mx-auto">
                ${getCharSVG(3, { extraClass: "char-chatter" })}
              </div>
              <div class="seated-cushion w-22 h-22 sm:w-28 sm:h-28 mx-auto">
                ${getCharSVG(1, { extraClass: "char-chatter" })}
              </div>
            </div>
          </div>
        </div>
      `;

      const doorOverlay = document.getElementById("doorIntroOverlay");
      const doorLeft = document.getElementById("doorLeft");
      const doorRight = document.getElementById("doorRight");
      const sighBox = document.getElementById("sighTextBox");

      doorLeft.classList.remove("door-open-left");
      doorRight.classList.remove("door-open-right");
      sighBox.style.opacity = "1";
      doorOverlay.classList.remove("hidden");

      updateDialogue("오두막의 친구들", "🐾", "......", "잠시 기다려주세요...", false);

      setTimeout(() => {
        sighBox.style.transition = "opacity 0.4s ease";
        sighBox.style.opacity = "0";
        doorLeft.classList.add("door-open-left");
        doorRight.classList.add("door-open-right");
        playChime(["G4", "B4", "D5"], "8n");
      }, 1150);

      setTimeout(() => {
        doorOverlay.classList.add("hidden");
        const bubble = document.getElementById("chatterBubble");
        if (bubble) {
          bubble.textContent = `❗ 모두 일제히 ${playerName} 쪽을 바라봤다! ❗`;
          bubble.classList.add("bg-amber-200");
        }
        const groupEl = document.getElementById("groupCabin6");
        if (groupEl) {
          groupEl.innerHTML = `
            <div class="mx-auto mb-2 px-4 py-1.5 rounded-full bg-amber-200 border-2 border-[#3e3636] font-cute text-xs sm:text-sm text-[#3e3636] shadow-md z-40">
              ❗ 모두 일제히 ${playerName} 쪽을 바라봤다! ❗
            </div>
            <div class="w-full flex flex-col gap-1.5">
              <div class="grid grid-cols-3 gap-1 sm:gap-2 px-6 sm:px-10 items-end">
                <div class="seated-cushion w-20 h-20 sm:w-24 sm:h-24 mx-auto">${getCharSVG(2, { extraClass: "char-notice" })}</div>
                <div class="seated-cushion w-20 h-20 sm:w-24 sm:h-24 mx-auto">${getCharSVG(4, { extraClass: "char-notice" })}</div>
                <div class="seated-cushion w-20 h-20 sm:w-24 sm:h-24 mx-auto">${getCharSVG(5, { extraClass: "char-notice" })}</div>
              </div>
              <div class="grid grid-cols-3 gap-2 sm:gap-3 px-2 sm:px-5 items-end -mt-2">
                <div class="seated-cushion w-22 h-22 sm:w-28 sm:h-28 mx-auto">${getCharSVG(6, { extraClass: "char-notice" })}</div>
                <div class="seated-cushion w-22 h-22 sm:w-28 sm:h-28 mx-auto">${getCharSVG(3, { extraClass: "char-notice" })}</div>
                <div class="seated-cushion w-22 h-22 sm:w-28 sm:h-28 mx-auto">${getCharSVG(1, { extraClass: "char-notice" })}</div>
              </div>
            </div>
          `;
        }
        updateDialogue(
          "오두막의 친구들",
          "🐾",
          `앗! 문이 열렸다—!\n"${playerName}!! 어서 와, 기다리고 있었어!"`,
          "대화창을 터치하세요",
          true
        );
      }, 2150);
    }

    function updateDialogue(speaker, icon, text, hint = "대화창을 터치하면 다음으로 넘어갑니다", showArrow = true) {
      document.getElementById("speakerName").textContent = speaker;
      document.getElementById("speakerIcon").textContent = icon;
      document.getElementById("dialogueText").textContent = text;
      document.getElementById("subHintText").textContent = hint;
      document.getElementById("nextArrow").style.visibility = showArrow ? "visible" : "hidden";
    }

    // ==================== 대화 진행 & 분기(4~13번) - FSM 상태 전이 엔진 ====================
    function renderFSMNode(nodeId) {
      const node = SCENARIO_GRAPH[nodeId];
      if (!node) return;

      currentStep = nodeId;
      document.getElementById("sceneBadge").textContent = node.badge;
      document.getElementById("endingActionBar").classList.add("hidden");

      const stageEl = document.getElementById("stageCharacters");
      if (node.duoLayout) {
        stageEl.innerHTML = `
          <div class="flex items-end justify-center gap-2 sm:gap-4 w-full">
            ${node.cast.map((c) => `<div class="${c.size}">${getCharSVG(c.id, c.opts || {})}</div>`).join("")}
          </div>`;
      } else if (node.clingLayout) {
        stageEl.innerHTML = `
          <div class="flex items-end justify-center w-full relative">
            ${node.cast.map((c) => `<div class="${c.size}">${getCharSVG(c.id, c.opts || {})}</div>`).join("")}
          </div>`;
      } else {
        const c = node.cast[0];
        stageEl.innerHTML = `<div class="${c.size}">${getCharSVG(c.id, c.opts || {})}</div>`;
      }

      updateDialogue(
        node.speaker,
        node.icon,
        node.getText(playerName),
        node.hint || "대화창을 터치하면 다음으로 넘어갑니다",
        true
      );
    }

    function handleNextDialogue() {
      if (currentStep === "5") return;
      playChime(["E5", "G5"], "16n");

      if (currentStep === "3") {
        renderFSMNode("4");
        return;
      }
      if (currentStep === "4") {
        currentStep = "5";
        document.getElementById("sceneBadge").textContent = "SCENE 05 · 고민 선택하기";
        document.getElementById("dialogueBox").classList.add("hidden");
        document.getElementById("choiceContainer").classList.remove("hidden");
        return;
      }
      if (currentStep === "13") {
        resetGame();
        return;
      }

      const currentNode = SCENARIO_GRAPH[currentStep];
      if (currentNode && currentNode.next) {
        if (currentNode.next === "13") {
          goToScene13Ending();
        } else {
          renderFSMNode(currentNode.next);
        }
      }
    }

    // 선택지 A, B, C 클릭 분기 처리
    function selectChoice(choice) {
      selectedRoute = choice;
      playChime(["C5", "E5", "G5", "C6"]);
      document.getElementById("choiceContainer").classList.add("hidden");
      document.getElementById("dialogueBox").classList.remove("hidden");

      const entryNodeMap = { A: "6", B: "8", C: "10" };
      renderFSMNode(entryNodeMap[choice] || "6");
    }

    // [화면 13] 최종 단체 엔딩
    function goToScene13Ending() {
      currentStep = "13";
      playChime(["C5", "E5", "G5", "B5", "C6"], "4n");
      document.getElementById("sceneBadge").textContent = "ENDING · 모두의 응원";

      document.getElementById("stageCharacters").innerHTML = `
        <div class="relative w-full max-w-lg h-64 sm:h-72 mx-auto flex flex-col justify-end pb-1">
          <div class="mx-auto mb-3 flex gap-2 text-xl animate-bounce z-40">
            <span>💕</span><span>✨</span><span>🌟</span><span>💖</span>
          </div>
          <div class="w-full grid grid-cols-6 gap-0.5 sm:gap-1 items-end px-1">
            <div class="seated-cushion w-full aspect-square">${getCharSVG(6)}</div>
            <div class="seated-cushion w-full aspect-square">${getCharSVG(1)}</div>
            <div class="seated-cushion w-full aspect-square">${getCharSVG(3)}</div>
            <div class="seated-cushion w-full aspect-square">${getCharSVG(5)}</div>
            <div class="seated-cushion w-full aspect-square char-cling">${getCharSVG(4, { extraClass: "" })}</div>
            <div class="seated-cushion w-full aspect-square">${getCharSVG(2)}</div>
          </div>
        </div>
      `;

      updateDialogue(
        "6마리 동물즈 전원",
        "🐾",
        `"${playerName}, 사랑해!\n오늘도 힘내자 우리!! 💕"`,
        "아래 버튼으로 포토카드를 저장하거나 방명록을 남겨보세요!",
        false
      );
      document.getElementById("endingActionBar").classList.remove("hidden");
    }

    // ==================== [CS #4] 실시간 별빛 방명록 UI 컨트롤러 ====================
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    async function openGuestbookModal() {
      playChime(["E5", "B5"], "16n");
      document.getElementById("gbAuthorPreview").textContent = playerName;
      document.getElementById("gbValidationMsg").textContent = "";
      document.getElementById("guestbookModal").classList.remove("hidden");
      guestbookRepo.subscribeRealtime((entries) => {
        renderGuestbookListUI(entries);
      });
    }

    function closeGuestbookModal() {
      document.getElementById("guestbookModal").classList.add("hidden");
    }

    function renderGuestbookListUI(list) {
      document.getElementById("guestbookCountBadge").textContent = list.length;
      const container = document.getElementById("guestbookList");
      container.innerHTML = list.map((item) => `
        <div class="p-3 rounded-xl bg-amber-50/70 border-2 border-[#3e3636]/20">
          <div class="flex items-center justify-between mb-1">
            <span class="font-cute text-xs sm:text-sm text-[#3e3636]">${escapeHTML(item.badge)} ${escapeHTML(item.author)}</span>
            <span class="text-[11px] text-stone-400">${escapeHTML(item.createdAt)}</span>
          </div>
          <p class="text-xs sm:text-sm text-stone-700 leading-snug break-words">${escapeHTML(item.message)}</p>
        </div>
      `).join("");
    }

    async function handleGuestbookSubmit(e) {
      e.preventDefault();
      const inputEl = document.getElementById("guestbookInput");
      const errEl = document.getElementById("gbValidationMsg");
      try {
        errEl.textContent = "";
        await guestbookRepo.createEntry(playerName, inputEl.value);
        inputEl.value = "";
        playChime(["C5", "E5", "G5", "C6"], "16n");
        if (!guestbookRepo.isCloudMode) {
          renderGuestbookListUI(await guestbookRepo.fetchRecent(30));
        }
      } catch (err) {
        errEl.textContent = err.message;
      }
    }

    // 인라인 onclick 핸들러에서 ES Module 함수 호출이 가능하도록 window 전역에 바인딩
    Object.assign(window, {
      toggleSound, goToScreen2, submitName, handleNextDialogue,
      selectChoice, downloadEndingPhotocard, openGuestbookModal,
      closeGuestbookModal, handleGuestbookSubmit, closePhotocardModal, resetGame
    });

    // ==================== [CS #5] SVG 직렬화 & HTML5 Canvas 래스터화 포토카드 생성기 ====================
    async function downloadEndingPhotocard() {
      playChime(["G5", "B5", "D6"], "16n");
      const modal = document.getElementById("photocardModal");
      const previewWrap = document.getElementById("photocardPreviewWrap");
      const downloadLink = document.getElementById("photocardDownloadLink");
      modal.classList.remove("hidden");
      previewWrap.innerHTML = `<span class="font-cute text-sm text-stone-500 animate-pulse">포토카드를 현상하는 중...</span>`;

      const canvas = document.createElement("canvas");
      canvas.width = 720;
      canvas.height = 920;
      const ctx = canvas.getContext("2d");

      const bgGrad = ctx.createLinearGradient(0, 0, 0, 920);
      bgGrad.addColorStop(0, "#fffdf7");
      bgGrad.addColorStop(1, "#fde68a");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 720, 920);

      ctx.strokeStyle = "#3e3636";
      ctx.lineWidth = 10;
      ctx.strokeRect(24, 24, 672, 872);

      ctx.fillStyle = "#472a19";
      ctx.fillRect(54, 60, 612, 470);
      const fireGlow = ctx.createRadialGradient(360, 320, 20, 360, 320, 260);
      fireGlow.addColorStop(0, "rgba(253, 224, 71, 0.55)");
      fireGlow.addColorStop(1, "rgba(71, 42, 25, 0)");
      ctx.fillStyle = fireGlow;
      ctx.fillRect(54, 60, 612, 470);

      const order = [6, 1, 3, 5, 4, 2];
      const charImages = await Promise.all(order.map((id) => {
        return new Promise((resolve) => {
          const rawSvg = getCharSVG(id, { extraClass: "" })
            .replace('class="w-full h-full svg-char "', 'width="220" height="220" xmlns="http://www.w3.org/2000/svg"');
          const blob = new Blob([rawSvg], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            resolve(null);
          };
          img.src = url;
        });
      }));

      charImages.forEach((img, idx) => {
        if (!img) return;
        const x = 62 + idx * 98;
        const y = 345;
        ctx.fillStyle = "#d97706";
        ctx.beginPath();
        ctx.ellipse(x + 52, y + 148, 42, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.drawImage(img, x, y, 106, 150);
      });

      ctx.fillStyle = "#fef3c7";
      ctx.font = "bold 24px 'Jua', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("24/7 WITH YOU · WARM CABIN", 360, 115);

      ctx.fillStyle = "#3e3636";
      ctx.font = "bold 44px 'Jua', sans-serif";
      ctx.fillText(`"${playerName}, 사랑해!"`, 360, 625);
      ctx.font = "bold 36px 'Jua', sans-serif";
      ctx.fillText("오늘도 힘내자 우리!! 💕", 360, 682);

      const routeQuotes = {
        A: "기 죽지 마! 연습하면 다 돼 진짜아 ✨",
        B: "너는 우리의 꿈이고 희망인걸, 우리를 믿어요!",
        C: "괜찮아, 굳이 행복하지 않아도 돼요 🥹"
      };
      ctx.fillStyle = "#78350f";
      ctx.font = "22px 'Noto Sans KR', sans-serif";
      ctx.fillText(routeQuotes[selectedRoute] || routeQuotes.A, 360, 745);

      const today = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" });
      ctx.fillStyle = "#78716c";
      ctx.font = "18px 'Noto Sans KR', sans-serif";
      ctx.fillText(`${today} · 마음의 오두막에서`, 360, 845);

      const dataUrl = canvas.toDataURL("image/png");
      downloadLink.href = dataUrl;
      downloadLink.download = `call_your_name_${playerName}.png`;
      previewWrap.innerHTML = `<img src="${dataUrl}" alt="응원 포토카드" class="w-full h-auto block"/>`;
    }

    function closePhotocardModal() {
      document.getElementById("photocardModal").classList.add("hidden");
    }

    // 처음부터 다시 시작
    function resetGame() {
      currentStep = "1";
      document.getElementById("cabinStage").classList.add("hidden");
      document.getElementById("cabinStage").classList.remove("flex");
      document.getElementById("screen2").classList.add("hidden");
      document.getElementById("screen2").classList.remove("flex");
      document.getElementById("choiceContainer").classList.add("hidden");
      document.getElementById("endingActionBar").classList.add("hidden");
      document.getElementById("dialogueBox").classList.remove("hidden");
      document.getElementById("restartTopBtn").classList.add("hidden");
      document.getElementById("screen1").classList.remove("hidden");
      document.getElementById("sceneBadge").textContent = "CHAPTER 01 · 오프닝";
    }
  </script>
